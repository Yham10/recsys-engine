# ================================================================
# RECSYS ENGINE - Docker Compose
# ================================================================

networks:
  recsys-network:
    driver: bridge
    name: recsys-network

volumes:
  postgres_data:
    name: recsys_postgres_data
  redis_data:
    name: recsys_redis_data
  zookeeper_data:
    name: recsys_zookeeper_data
  kafka_data:
    name: recsys_kafka_data
  minio_data:
    name: recsys_minio_data
  mlflow_data:
    name: recsys_mlflow_data
  airflow_logs:
    name: recsys_airflow_logs
  serving_logs:
    name: recsys_serving_logs


services:

  # ==============================================================
  # 1. ZOOKEEPER
  # ==============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: recsys-zookeeper
    hostname: zookeeper
    networks:
      - recsys-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 2. KAFKA
  # ==============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recsys-kafka
    hostname: kafka
    networks:
      - recsys-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==============================================================
  # 3. KAFKA UI
  # Access: http://localhost:8080
  # ==============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: recsys-kafka-ui
    hostname: kafka-ui
    networks:
      - recsys-network
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: recsys-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  # ==============================================================
  # 4. POSTGRESQL
  # ── FIX: port changed to 5432:5432 for consistency
  # ── FIX: healthcheck uses recsys_db (the default db)
  # ── FIX: init.sql creates feast_db, mlflow_db, airflow_db
  # ==============================================================
  postgres:
    image: postgres:15-alpine
    container_name: recsys-postgres
    hostname: postgres
    networks:
      - recsys-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"       # FIX: was 5433:5432 — now consistent
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      # FIX: healthcheck against recsys_db (POSTGRES_DB)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 5. REDIS
  # ==============================================================
  redis:
    image: redis:7.2-alpine
    container_name: recsys-redis
    hostname: redis
    networks:
      - recsys-network
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 6. MINIO
  # Console: http://localhost:9001
  # ==============================================================
  minio:
    image: minio/minio:latest
    container_name: recsys-minio
    hostname: minio
    networks:
      - recsys-network
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: recsys-minio-init
    networks:
      - recsys-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/mlflow-artifacts;
      mc mb --ignore-existing local/feast-offline-store;
      echo 'MinIO buckets initialized successfully';
      exit 0;
      "
    restart: on-failure

  # ==============================================================
  # 7. MLFLOW
  # ── FIX: uses mlflow_db (separate from recsys_db)
  # UI: http://localhost:5000
  # ==============================================================
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: recsys-mlflow
    hostname: mlflow
    networks:
      - recsys-network
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow_db
      --default-artifact-root s3://mlflow-artifacts/
      --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==============================================================
  # 8. AIRFLOW INIT
  # ── FIX: uses airflow_db (separate from recsys_db)
  # ==============================================================
  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: recsys-airflow-init
    hostname: airflow-init
    networks:
      - recsys-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # FIX: points to airflow_db
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      PYTHONPATH: /opt/airflow/recsys_src:/opt/airflow/recsys_src/orchestration
      FEAST_REPO_PATH: /opt/airflow/recsys_src/feature_store/feature_repo
    volumes:
      - ./src/orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/recsys_src
      - ./data:/opt/airflow/data
      - ./configs:/opt/airflow/configs
      - airflow_logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@recsys.local \
          --password admin || true
        echo "Airflow initialized successfully"
    restart: on-failure

  # ==============================================================
  # 9. AIRFLOW WEBSERVER
  # UI: http://localhost:8090
  # ==============================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: recsys-airflow-webserver
    hostname: airflow-webserver
    networks:
      - recsys-network
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8090:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      PYTHONPATH: /opt/airflow/recsys_src:/opt/airflow/recsys_src/orchestration
      FEAST_REPO_PATH: /opt/airflow/recsys_src/feature_store/feature_repo
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      FASTAPI_BASE_URL: http://recsys-serving:8000
    volumes:
      - ./src/orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/recsys_src
      - ./data:/opt/airflow/data
      - ./configs:/opt/airflow/configs
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 10. AIRFLOW SCHEDULER
  # ==============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: recsys-airflow-scheduler
    hostname: airflow-scheduler
    networks:
      - recsys-network
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/recsys_src:/opt/airflow/recsys_src/orchestration
      FEAST_REPO_PATH: /opt/airflow/recsys_src/feature_store/feature_repo
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      FASTAPI_BASE_URL: http://recsys-serving:8000
    volumes:
      - ./src/orchestration/dags:/opt/airflow/dags
      - ./src:/opt/airflow/recsys_src
      - ./data:/opt/airflow/data
      - ./configs:/opt/airflow/configs
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

    # ==============================================================
  # 11. SERVING (FastAPI)
  # UI: http://localhost:8000/docs
  # ==============================================================
  serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    container_name: recsys-serving
    hostname: serving
    networks:
      - recsys-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: two-tower-recommender
      MLFLOW_MODEL_STAGE: latest
      MINIO_ENDPOINT: http://minio:9000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      FEAST_DB: feast_db
      FEAST_REPO_PATH: /app/feature_repo
      ARTIFACTS_DIR: /app/artifacts
      PROCESSED_DIR: /data/processed
    volumes:
      - ./data/artifacts:/data/artifacts
      - ./data/processed:/data/processed
      - serving_logs:/app/logs
      - ./src/feature_store/feature_repo:/app/feature_repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped