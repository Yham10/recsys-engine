# ================================================================
# RECSYS ENGINE - Docker Compose
# Production-grade local infrastructure
# Services: Kafka, Zookeeper, Redis, PostgreSQL,
#           MLflow, MinIO, Airflow
# ================================================================

version: '3.8'

# ----------------------------------------------------------------
# SHARED NETWORK
# All services communicate on this internal network
# ----------------------------------------------------------------
networks:
  recsys-network:
    driver: bridge
    name: recsys-network

# ----------------------------------------------------------------
# NAMED VOLUMES
# Persistent storage that survives container restarts
# ----------------------------------------------------------------
volumes:
  postgres_data:
    name: recsys_postgres_data
  redis_data:
    name: recsys_redis_data
  zookeeper_data:
    name: recsys_zookeeper_data
  kafka_data:
    name: recsys_kafka_data
  minio_data:
    name: recsys_minio_data
  mlflow_data:
    name: recsys_mlflow_data


services:

  # ==============================================================
  # 1. ZOOKEEPER
  # Required by Kafka for cluster coordination
  # ==============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: recsys-zookeeper
    hostname: zookeeper
    networks:
      - recsys-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 2. KAFKA
  # Message broker for real-time user event streaming
  # ==============================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: recsys-kafka
    hostname: kafka
    networks:
      - recsys-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"     # Internal (container-to-container)
      - "29092:29092"   # External (host machine access)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168       # Keep messages for 7 days
      KAFKA_LOG_SEGMENT_BYTES: 1073741824  # 1GB log segments
      KAFKA_NUM_PARTITIONS: 3              # Parallelism for consumers
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ==============================================================
  # 3. KAFKA UI
  # Web UI for monitoring Kafka topics and messages
  # Access: http://localhost:8080
  # ==============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: recsys-kafka-ui
    hostname: kafka-ui
    networks:
      - recsys-network
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: recsys-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    restart: unless-stopped

  # ==============================================================
  # 4. POSTGRESQL
  # - Feast Offline Store (historical feature data)
  # - MLflow Backend Store (experiment metadata)
  # ==============================================================
  postgres:
    image: postgres:15-alpine
    container_name: recsys-postgres
    hostname: postgres
    networks:
      - recsys-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 5. REDIS
  # Feast Online Store for real-time feature serving (<10ms)
  # ==============================================================
  redis:
    image: redis:7.2-alpine
    container_name: recsys-redis
    hostname: redis
    networks:
      - recsys-network
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================
  # 6. MINIO (Local S3)
  # Artifact storage for MLflow (models, plots, files)
  # Console: http://localhost:9001
  # ==============================================================
  minio:
    image: minio/minio:latest
    container_name: recsys-minio
    hostname: minio
    networks:
      - recsys-network
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API endpoint
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # MinIO bucket initialization (runs once then exits)
  minio-init:
    image: minio/mc:latest
    container_name: recsys-minio-init
    networks:
      - recsys-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/mlflow-artifacts;
      mc mb --ignore-existing local/feast-offline-store;
      echo 'MinIO buckets initialized successfully';
      exit 0;
      "
    restart: on-failure

  # ==============================================================
  # 7. MLFLOW
  # Experiment tracking, model registry
  # UI: http://localhost:5000
  # ==============================================================
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    container_name: recsys-mlflow
    hostname: mlflow
    networks:
      - recsys-network
    volumes:
      - mlflow_data:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --default-artifact-root s3://mlflow-artifacts/
      --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped