# ================================================================
# Redis Configuration for Feast Online Store
# Optimized for low-latency feature serving
# ================================================================

# --- Network ---
bind 0.0.0.0
port 6379
protected-mode no

# --- Persistence (RDB Snapshots) ---
# Save snapshot if at least 1 key changed in 900 seconds
save 900 1
save 300 10
save 60 10000

# --- Memory Management ---
maxmemory 512mb
# Evict least recently used keys
maxmemory-policy allkeys-lru   

# --- Performance ---
tcp-keepalive 300
timeout 0
tcp-backlog 511

# --- Logging ---
loglevel notice
logfile ""

# --- Append Only File (AOF) for durability ---
appendonly yes
appendfsync everysec